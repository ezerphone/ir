name: Screens

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build screenshot APK (no native libs)
        run: chmod +x ./gradlew && ./gradlew assembleDebug -PnoNative --stacktrace

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/screens.sh

      - name: Push screenshots to the 'screens' branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots/* /tmp/out/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan screens-tmp
          git rm -rf --cached . >/dev/null
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/out/* . 2>/dev/null || true
          git add -A
          git commit -m "screens ${GITHUB_SHA}" || exit 0
          git push -f origin HEAD:screens
