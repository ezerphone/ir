plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offlineremote.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.offlineremote.app"
        minSdk 21
        targetSdk 34
        // increases with every CI build so each APK installs as an update
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() + 100 : 1
        versionName "0.2"
        ndk {
            // Match the ABIs of the bundled Tiqiaa native libraries
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Fixed signing key: every build has the same signature, so a new APK installs
    // over the previous one instead of being rejected.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CI screenshot build (-PnoNative): drop the ARM-only native libs so the APK installs
    // on the x86_64 emulator. The screens being captured never load them.
    packaging {
        if (project.hasProperty('noNative')) {
            jniLibs { excludes += ['**/*.so'] }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
